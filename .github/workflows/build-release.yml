
name: NusaFit Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check Project Files
        run: |
          echo "Isi repository:"
          ls -la

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts tidak ditemukan"
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
