
name: NusaFit Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Ambil kode dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Siapkan Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Siapkan lokasi Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME"

      # 4. Cari sdkmanager dan pasang SDK 36
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            find "$ANDROID_HOME" -maxdepth 4 -type f \
              -name sdkmanager -print
            exit 1
          fi

          echo "Menggunakan: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Periksa struktur proyek
      - name: Check Project Files
        shell: bash
        run: |
          echo "Isi root repository:"
          ls -la

          echo "Isi folder app:"
          ls -la app

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts tidak ditemukan"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts tidak ditemukan"
            exit 1
          fi

      # 6. Siapkan Gradle tanpa membutuhkan gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # 7. Periksa versi Gradle
      - name: Check Gradle
        run: gradle --version

      # 8. Build APK Debug
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 9. Build APK Release
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      # 10. Simpan hasil APK Debug
      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # 11. Simpan hasil APK Release
      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
